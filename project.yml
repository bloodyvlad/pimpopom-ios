name: PimPoPom

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  PimPoPomCore:
    path: Packages/PimPoPomCore

fileGroups:
  - Config/PimPoPom.storekit

targets:
  PimPoPom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PimPoPomCore
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - AppIconLight
          - AppIconPixel
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/PimPoPom.entitlements
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_NAME: PimPoPom
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1

  PimPoPomUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: PimPoPom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otcsoftware.pimpopom.uitests
        TEST_TARGET_NAME: PimPoPom

  PimPoPomTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/Unit
    dependencies:
      - target: PimPoPom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otcsoftware.pimpopom.tests

schemes:
  PimPoPom:
    build:
      targets:
        PimPoPom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PimPoPomTests
        - PimPoPomUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  PimPoPom Staging:
    build:
      targets:
        PimPoPom: all
    run:
      config: Staging
    profile:
      config: Staging
    analyze:
      config: Staging
    archive:
      config: Staging

  PimPoPom StoreKit Local:
    build:
      targets:
        PimPoPom: all
    run:
      config: Debug
      storeKitConfiguration: Config/PimPoPom.storekit
      commandLineArguments:
        "--local-storekit-credit": true
    analyze:
      config: Debug
