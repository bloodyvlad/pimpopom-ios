name: PimPoPom

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  PimPoPomCore:
    path: Packages/PimPoPomCore

targets:
  PimPoPom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: PimPoPomCore
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        PRODUCT_NAME: PimPoPom
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: 1

  PimPoPomUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UITests
    dependencies:
      - target: PimPoPom
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.otcsoft.pimpopom.alpha.uitests
        TEST_TARGET_NAME: PimPoPom

schemes:
  PimPoPom:
    build:
      targets:
        PimPoPom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PimPoPomUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
